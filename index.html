<!DOCTYPE html>
<html lang="kk">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FITCORE — Фитнес-платформа</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-2: #12121a;
      --card: #16161f;
      --border: #24242f;
      --text: #eaeaf0;
      --muted: #8a8a99;
      --accent: #ff6a1a;
      --accent-2: #ff8c42;
      --neon: #00e5ff;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 14px;
      --shadow: 0 10px 40px rgba(255, 106, 26, .15);
      --font: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      background-image:
        radial-gradient(1200px 600px at 90% -10%, rgba(255, 106, 26, .12), transparent 60%),
        radial-gradient(900px 500px at -10% 20%, rgba(0, 229, 255, .08), transparent 60%);
    }

    a {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: .95rem;
      transition: .2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-sm {
      padding: .5rem 1rem;
      font-size: .85rem;
    }

    .input,
    select,
    textarea {
      width: 100%;
      padding: .8rem 1rem;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: .95rem;
      transition: .2s;
      font-family: inherit;
    }

    .input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 106, 26, .15);
    }

    label {
      display: block;
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: .4rem;
    }

    .field {
      margin-bottom: 1.1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: .25s;
    }

    .card:hover {
      border-color: rgba(255, 106, 26, .4);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 10, 15, .85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      gap: 1rem;
    }

    .logo {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: .5px;
      cursor: pointer;
    }

    .logo span {
      color: var(--accent);
    }

    .nav {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--muted);
      font-weight: 500;
      cursor: pointer;
    }

    .nav a:hover {
      color: var(--accent);
    }

    .badge {
      display: inline-block;
      padding: .25rem .7rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 600;
    }

    .badge-success {
      background: rgba(34, 197, 94, .15);
      color: var(--success);
    }

    .badge-warn {
      background: rgba(255, 106, 26, .15);
      color: var(--accent);
    }

    .badge-danger {
      background: rgba(239, 68, 68, .15);
      color: var(--danger);
    }

    .badge-info {
      background: rgba(0, 229, 255, .12);
      color: var(--neon);
    }

    .grid {
      display: grid;
      gap: 1.25rem;
    }

    .grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .grid-4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .section {
      padding: 5rem 0;
    }

    .section-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: .75rem;
    }

    .section-sub {
      color: var(--muted);
      margin-bottom: 2.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-label {
      color: var(--muted);
      font-size: .85rem;
    }

    .app-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--bg-2);
      border-right: 1px solid var(--border);
      padding: 1.5rem 1rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .sidebar nav {
      display: flex;
      flex-direction: column;
      gap: .25rem;
      margin-top: 1rem;
    }

    .sidebar nav a {
      padding: .7rem 1rem;
      border-radius: 10px;
      color: var(--muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: .7rem;
      cursor: pointer;
    }

    .sidebar nav a:hover {
      background: rgba(255, 106, 26, .08);
      color: var(--text);
    }

    .sidebar nav a.active {
      background: linear-gradient(135deg, rgba(255, 106, 26, .2), rgba(255, 106, 26, .05));
      color: var(--accent);
      border-left: 3px solid var(--accent);
    }

    .content {
      padding: 2rem;
      overflow-x: hidden;
    }

    .page-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 1.5rem;
    }

    .progress {
      height: 8px;
      background: var(--bg-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress>span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width .4s;
    }

    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
    }

    th {
      text-align: left;
      color: var(--muted);
      padding: .6rem .5rem;
      font-weight: 600;
    }

    td {
      padding: .6rem .5rem;
      border-top: 1px solid var(--border);
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 100;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.5rem;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
      opacity: 0;
      transform: translateY(20px);
      transition: .3s;
      pointer-events: none;
      max-width: 360px;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    #toast.success {
      border-left-color: var(--success);
    }

    #toast.error {
      border-left-color: var(--danger);
    }

    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {

      .grid-2,
      .grid-3,
      .grid-4 {
        grid-template-columns: 1fr;
      }

      .app-layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
      }

      .section {
        padding: 3rem 0;
      }

      .section-title {
        font-size: 1.5rem;
      }

      .content {
        padding: 1rem;
      }

      .nav {
        gap: .75rem;
        font-size: .9rem;
      }
    }
  </style>
</head>

<body>

    /* =========================================================

    const firebaseConfig = {

    /* =========================================================

        email: 'ivan@example.com', phone: '+7 999 123-45-67',
        membership: {
          type: 'premium', startDate: '2025-01-15', endDate: '2025-07-15',
          totalSessions: 50, usedSessions: 17, status: 'active'
        },
        progress: {
          weight: [
            { date: '2025-02-01', value: 82.5 },
            { date: '2025-03-01', value: 80.1 },
            { date: '2025-04-01', value: 78.6 }
          ],
          measurements: [
            { date: '2025-02-01', chest: 104, waist: 92, hips: 100 },
            { date: '2025-03-01', chest: 102, waist: 88, hips: 98 }
          ],
          achievements: ['first_workout', '10_sessions', 'month_streak'],
          trainingPlan: { id: 'plan_hypertrophy_01', name: 'Гипертрофия · 4 дня/нед', startedAt: '2025-02-01' }
        }
      },
      trainers: {

        trainer_002: { id: 'trainer_002', name: 'Дмитрий Орлов', specialization: ['crossfit', 'functional'], experience: 5, rating: 4.8, bio: 'КМС по кроссфиту' },
        trainer_003: { id: 'trainer_003', name: 'Анна Ким', specialization: ['пилатес', 'стретчинг'], experience: 6, rating: 5.0, bio: 'Пилатес BASI' }
      },
      halls: {
        hall_001: { id: 'hall_001', name: 'A залы · Йога', capacity: 20, status: 'open' },
        hall_002: { id: 'hall_002', name: 'CrossFit залы', capacity: 15, status: 'open' },
        hall_003: { id: 'hall_003', name: 'Pilates залы', capacity: 12, status: 'open' }
      },
      classes: {
        class_yoga_01: { id: 'class_yoga_01', title: 'Хатха-йога', type: 'group', trainerId: 'trainer_001', hallId: 'hall_001', datetime: '2025-03-15T18:00:00Z', durationMin: 60, capacity: 20, booked: 12, price: 800, level: 'beginner', online: true, totalBookings: 145, streamUrl: 'https://live.fitcore.ru/yoga_01', rating: { avg: 4.8, count: 62, sum: 297.6 } },
        class_crossfit_02: { id: 'class_crossfit_02', title: 'CrossFit WOD', type: 'group', trainerId: 'trainer_002', hallId: 'hall_002', datetime: '2025-03-15T19:30:00Z', durationMin: 75, capacity: 15, booked: 15, price: 1000, level: 'intermediate', online: false, totalBookings: 132, streamUrl: null, rating: { avg: 4.8, count: 45, sum: 216 } },
        class_pilates_03: { id: 'class_pilates_03', title: 'Пилатес', type: 'group', trainerId: 'trainer_003', hallId: 'hall_003', datetime: '2025-03-16T10:00:00Z', durationMin: 50, capacity: 12, booked: 5, price: 700, level: 'beginner', online: true, totalBookings: 98, streamUrl: 'https://live.fitcore.ru/pilates_03', rating: { avg: 4.9, count: 40, sum: 196 } },
        class_yoga_04: { id: 'class_yoga_04', title: 'Арқаға арналған йога', type: 'group', trainerId: 'trainer_001', hallId: 'hall_001', datetime: '2025-03-16T12:00:00Z', durationMin: 60, capacity: 20, booked: 8, price: 800, level: 'beginner', online: false, totalBookings: 76, streamUrl: null, rating: { avg: 4.78, count: 31, sum: 148.2 } }
      },
      bookingsByUser: {
        client_001: {
          class_yoga_01: { bookedAt: '2025-03-12T09:00:00Z', status: 'confirmed' },
          class_crossfit_02: { bookedAt: '2025-03-12T09:05:00Z', status: 'confirmed' }
        }
      },
      onlineTrainings: {
        online_001: { id: 'online_001', title: 'Таңғы жаттығу Live', trainerId: 'trainer_001', scheduledAt: '2025-03-16T07:00:00Z', durationMin: 30, streamUrl: 'https://live.fitcore.ru/morning_01', totalSubscribers: 1 },
        online_002: { id: 'online_002', title: 'Кешкі стретчинг', trainerId: 'trainer_001', scheduledAt: '2025-03-16T21:00:00Z', durationMin: 40, streamUrl: 'https://live.fitcore.ru/stretch_02', totalSubscribers: 0 }
      },
      accessControl: {
        turnstiles: {
          turnstile_01: { id: 'turnstile_01', location: 'A кіреберіс', status: 'online', lastPingAt: '2025-03-15T17:58:00Z' },
          turnstile_02: { id: 'turnstile_02', location: 'B кіреберіс', status: 'online', lastPingAt: '2025-03-15T17:57:00Z' }
        }
      },
      accessLogs: {
        '-Nabc001': { userId: 'client_001', turnstileId: 'turnstile_01', timestamp: '2025-03-15T17:55:00Z', result: 'granted', method: 'qr' },
        '-Nabc002': { userId: 'client_002', turnstileId: 'turnstile_01', timestamp: '2025-03-15T18:02:00Z', result: 'granted', method: 'card' },
        '-Nabc003': { userId: 'unknown', turnstileId: 'turnstile_02', timestamp: '2025-03-15T18:05:00Z', result: 'denied', method: 'qr', reason: 'expired_membership' }
      },
      analytics: {
        hallLoad: {
          hall_001: { avgLoadPercent: 78, peakHour: 18 },
          hall_002: { avgLoadPercent: 92, peakHour: 19 },
          hall_003: { avgLoadPercent: 45, peakHour: 10 }
        },
        retention: {
          monthly: [
            { month: '2025-01', rate: 0.82 }, { month: '2025-02', rate: 0.85 }, { month: '2025-03', rate: 0.83 }
          ]
        },
        popularClasses: [
          { classId: 'class_yoga_01', title: 'Хатха-йога', totalBookings: 145 },
          { classId: 'class_crossfit_02', title: 'CrossFit WOD', totalBookings: 132 },
          { classId: 'class_pilates_03', title: 'Пилатес', totalBookings: 98 }
        ],
        topClass: { classId: 'class_yoga_01', title: 'Хатха-йога', trainerId: 'trainer_001', totalBookings: 145, avgRating: 4.8 },
        totals: { activeClients: 248, activeTrainers: 12, classesThisWeek: 42, onlineTrainingsThisWeek: 8 }
      }
    };

    /* =========================================================
       3. API LAYER
       ========================================================= */
    const API = {
      async getUser(uid) {
        if (!FIREBASE_READY || !db) {
          return uid === 'client_001' ? { ...MOCK.currentUser } : null;
        }
        const snap = await get(ref(db, `users/${uid}`));
        return snap.exists() ? snap.val() : null;
      },

      async updateUser(uid, patch) {
        if (!FIREBASE_READY || !db) { Object.assign(MOCK.currentUser, patch); return true; }
        await update(ref(db, `users/${uid}`), patch);
        return true;
      },

      async getAllUsers() {
        if (!FIREBASE_READY || !db) {
          return {
            client_001: MOCK.currentUser, client_002: {
              uid: 'client_002', role: 'client', firstName: 'Ольга', lastName: 'Соколова',
              email: 'olga@example.com', phone: '+7 999 765-43-21',
              membership: {
                type: 'basic', startDate: '2025-02-10', endDate: '2025-05-10',
                totalSessions: 20, usedSessions: 6, status: 'active'
              }
            }
          };
        }
        const snap = await get(ref(db, 'users'));
        return snap.exists() ? snap.val() : {};
      },

      async getAllClients() {
        const users = await this.getAllUsers();
        return Object.values(users).filter(u => u.role === 'client');
      },

      async getClasses() {
        if (!FIREBASE_READY || !db) return { ...MOCK.classes };
        const snap = await get(ref(db, 'classes'));
        return snap.exists() ? snap.val() : {};
      },
      async getClassById(id) {
        if (!FIREBASE_READY || !db) return MOCK.classes[id] || null;
        const snap = await get(ref(db, `classes/${id}`));
        return snap.exists() ? snap.val() : null;
      },
      async createClass(payload) {
        if (!FIREBASE_READY || !db) { MOCK.classes[payload.id] = payload; return payload.id; }
        const newRef = push(ref(db, 'classes'));
        const id = newRef.key;
        await set(newRef, { ...payload, id });
        return id;
      },
      async deleteClass(id) {
        if (!FIREBASE_READY || !db) { delete MOCK.classes[id]; return true; }
        await remove(ref(db, `classes/${id}`));
        return true;
      },
      async getTrainers() {
        if (!FIREBASE_READY || !db) return { ...MOCK.trainers };
        const snap = await get(ref(db, 'trainers'));
        return snap.exists() ? snap.val() : {};
      },
      async getHalls() {
        if (!FIREBASE_READY || !db) return { ...MOCK.halls };
        const snap = await get(ref(db, 'halls'));
        return snap.exists() ? snap.val() : {};
      },

      async bookClass(uid, classId) {
        if (!FIREBASE_READY || !db) {
          if (!MOCK.bookingsByUser[uid]) MOCK.bookingsByUser[uid] = {};
          MOCK.bookingsByUser[uid][classId] = { bookedAt: new Date().toISOString(), status: 'confirmed' };
          if (MOCK.classes[classId]) MOCK.classes[classId].booked++;
          return true;
        }

        const userBookingSnap = await get(ref(db, `bookingsByUser/${uid}/${classId}`));
        if (userBookingSnap.exists()) throw new Error('Сіз бұл сабаққа тіркелгенсіз');

        const classRef = ref(db, `classes/${classId}`);
        const result = await runTransaction(classRef, (c) => {
          if (!c) return c;
          if ((c.booked || 0) >= c.capacity) return;
          c.booked = (c.booked || 0) + 1;
          c.totalBookings = (c.totalBookings || 0) + 1;
          return c;
        });
        if (!result.committed) throw new Error('Орын жоқ');

        const now = new Date().toISOString();
        await Promise.all([
          set(ref(db, `bookingsByClass/${classId}/${uid}`), {
            bookedAt: now, status: 'confirmed', attended: false
          }),
          set(ref(db, `bookingsByUser/${uid}/${classId}`), {
            bookedAt: now, status: 'confirmed'
          })
        ]);
        return true;
      },

      async cancelBooking(uid, classId) {
        if (!FIREBASE_READY || !db) {
          if (MOCK.bookingsByUser[uid]?.[classId]) {
            delete MOCK.bookingsByUser[uid][classId];
            if (MOCK.classes[classId]) MOCK.classes[classId].booked--;
          }
          return true;
        }

        await Promise.all([
          remove(ref(db, `bookingsByClass/${classId}/${uid}`)),
          remove(ref(db, `bookingsByUser/${uid}/${classId}`))
        ]);

        await runTransaction(ref(db, `classes/${classId}`), (c) => {
          if (!c) return c;
          c.booked = Math.max(0, (c.booked || 0) - 1);
          return c;
        });
        return true;
      },

      async getUserBookings(uid) {
        if (!FIREBASE_READY || !db) return MOCK.bookingsByUser[uid] || {};
        const snap = await get(ref(db, `bookingsByUser/${uid}`));
        return snap.exists() ? snap.val() : {};
      },

      async getOnlineTrainings() {
        if (!FIREBASE_READY || !db) return { ...MOCK.onlineTrainings };
        const snap = await get(ref(db, 'onlineTrainings'));
        return snap.exists() ? snap.val() : {};
      },

      async subscribeOnline(uid, onlineId) {
        if (!FIREBASE_READY || !db) {
          if (MOCK.onlineTrainings[onlineId]) MOCK.onlineTrainings[onlineId].totalSubscribers++;
          return true;
        }
        await set(ref(db, `onlineTrainings/${onlineId}/subscribers/${uid}`), true);
        await runTransaction(ref(db, `onlineTrainings/${onlineId}/totalSubscribers`), (n) => (n || 0) + 1);
        return true;
      },

      async getProgress(uid) {
        if (!FIREBASE_READY || !db) return { ...MOCK.currentUser.progress };
        const snap = await get(ref(db, `users/${uid}/progress`));
        return snap.exists() ? snap.val() : { weight: [], measurements: [], achievements: [] };
      },

      async addWeightEntry(uid, entry) {
        if (!FIREBASE_READY || !db) {
          MOCK.currentUser.progress.weight.push(entry);
          return true;
        }
        const listRef = ref(db, `users/${uid}/progress/weight`);
        const snap = await get(listRef);
        const arr = snap.val() || [];
        arr.push(entry);
        await set(listRef, arr);
        return true;
      },

      async getAccessLogs() {
        if (!FIREBASE_READY || !db) return { ...MOCK.accessLogs };
        const snap = await get(query(ref(db, 'accessLogs'), limitToLast(50)));
        return snap.exists() ? snap.val() : {};
      },
      async getTurnstiles() {
        if (!FIREBASE_READY || !db) return { ...MOCK.accessControl.turnstiles };
        const snap = await get(ref(db, 'accessControl/turnstiles'));
        return snap.exists() ? snap.val() : {};
      },

      async getAnalytics() {
        if (!FIREBASE_READY || !db) return { ...MOCK.analytics };
        const snap = await get(ref(db, 'analytics'));
        return snap.exists() ? snap.val() : MOCK.analytics;
      },

      async login(email, password) {
        if (!FIREBASE_READY || !db) {
          if (email === 'ivan@example.com' && password === '123456') return { ...MOCK.currentUser };
          if (email === 'admin@fitcore.ru' && password === 'admin') {
            return { uid: 'admin_001', role: 'admin', firstName: 'Алексей', lastName: 'Смирнов', email };
          }
          throw new Error('Қате email немесе құпиясөз (демо: ivan@example.com / 123456)');
        }

        const snap = await get(ref(db, 'users'));
        if (!snap.exists()) throw new Error('Пайдаланушылар базасы бос');

        const users = snap.val();
        const found = Object.values(users).find(u =>
          u.email && u.email.toLowerCase() === email.toLowerCase() &&
          u.password === password
        );
        if (!found) throw new Error('Қате email немесе құпиясөз');
        return found;
      },

      async register(payload) {
        if (!FIREBASE_READY || !db) return 'client_new';

        const snap = await get(ref(db, 'users'));
        const users = snap.exists() ? snap.val() : {};
        const exists = Object.values(users).some(u =>
          u.email && u.email.toLowerCase() === payload.email.toLowerCase()
        );
        if (exists) throw new Error('Email тіркелген');

        const uid = 'user_' + Date.now().toString(36);
        const newUser = {
          uid, role: 'client',
          firstName: payload.firstName,
          lastName: payload.lastName,
          email: payload.email,
          password: payload.password,
          phone: payload.phone || '',
          avatar: '',
          createdAt: new Date().toISOString(),
          lastVisitAt: new Date().toISOString(),
          membership: {
            type: 'basic',
            startDate: new Date().toISOString().slice(0, 10),
            endDate: new Date(Date.now() + 90 * 24 * 3600 * 1000).toISOString().slice(0, 10),
            totalSessions: 20, usedSessions: 0, status: 'active'
          },
          progress: {
            weight: [], measurements: [], achievements: [], trainingPlan: null
          }
        };
        await set(ref(db, `users/${uid}`), newUser);
        return uid;
      },

      async resetPassword(email, newPassword) {
        if (!FIREBASE_READY || !db) return true;
        const snap = await get(ref(db, 'users'));
        const users = snap.exists() ? snap.val() : {};
        const entry = Object.entries(users).find(([, u]) =>
          u.email && u.email.toLowerCase() === email.toLowerCase()
        );
        if (!entry) throw new Error('Пайдаланушы табылмады');
        await update(ref(db, `users/${entry[0]}`), { password: newPassword });
        return true;
      },

      async logout() {
        state.user = null;
        localStorage.removeItem('fitcore_user');
        return true;
      }
    };

    /* =========================================================
       4. STATE
       ========================================================= */
    const state = { user: null, route: 'home' };

    /* =========================================================
       5. UTILS
       ========================================================= */
    function toast(msg, type = 'info') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'show ' + type;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.className = '', 3000);
    }
    function fmtDate(iso, opts) {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleString('kk-KZ', opts || {
          day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
        });
      } catch { return iso; }
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, m =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
    function homeFor(role) {
      if (role === 'admin' || role === 'trainer') return `${role}/dashboard`;
      return 'client/dashboard';
    }
    function navigate(route) { location.hash = route; }

    /* =========================================================
       6. ROUTER (без settings)
       ========================================================= */
    const ROUTES = {
      home: { render: renderHome, public: true },
      login: { render: renderLogin, public: true },
      register: { render: renderRegister, public: true },
      reset: { render: renderReset, public: true },

      'client/dashboard': { render: renderClientDashboard, role: 'client' },
      'client/schedule': { render: renderClientSchedule, role: 'client' },
      'client/trainings': { render: renderClientTrainings, role: 'client' },
      'client/progress': { render: renderClientProgress, role: 'client' },

      'admin/dashboard': { render: renderAdminDashboard, role: 'admin' },
      'admin/schedule': { render: renderAdminSchedule, role: 'admin' },
      'admin/clients': { render: renderAdminClients, role: 'admin' },
      'admin/access': { render: renderAdminAccess, role: 'admin' },
      'admin/analytics': { render: renderAdminAnalytics, role: 'admin' },

      'trainer/dashboard': { render: renderAdminDashboard, role: 'trainer' },
      'trainer/schedule': { render: renderAdminSchedule, role: 'trainer' },
      'trainer/clients': { render: renderAdminClients, role: 'trainer' }
    };

    async function router() {
      const hash = location.hash.replace(/^#\/?/, '') || 'home';
      const route = ROUTES[hash] || ROUTES.home;
      state.route = hash;

      if (route.role && (!state.user || state.user.role !== route.role)) {
        toast('Кіру қажет', 'error');
        return navigate('login');
      }
      if (route.public && state.user && (hash === 'login' || hash === 'register')) {
        return navigate(homeFor(state.user.role));
      }

      const app = document.getElementById('app');
      app.innerHTML = '<div style="padding:3rem;text-align:center;"><span class="loader"></span></div>';
      try {
        const html = await route.render();
        app.innerHTML = html;
        bindRouteEvents(hash);
        window.scrollTo(0, 0);
      } catch (err) {
        console.error(err);
        app.innerHTML = `<div class="container" style="padding:3rem 0;">
      <div class="card" style="border-color:var(--danger);">
        <h2 style="color:var(--danger);">Қате</h2>
        <pre style="white-space:pre-wrap;color:var(--muted);margin-top:1rem;">${esc(err.message)}</pre>
        <button class="btn btn-ghost" style="margin-top:1rem;" data-nav="home">Басты бетке</button>
      </div>
    </div>`;
      }
    }
    window.addEventListener('hashchange', router);

    function bindRouteEvents(hash) {

      const loginForm = document.getElementById('login-form');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = loginForm.querySelector('button[type=submit]');
          btn.disabled = true; btn.textContent = 'Кіру…';
          try {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const user = await API.login(email, password);
            state.user = user;
            localStorage.setItem('fitcore_user', JSON.stringify(user));
            toast('Қош келдіңіз, ' + (user.firstName || '') + '!', 'success');
            navigate(homeFor(user.role));
          } catch (err) {
            toast(err.message || 'Кіру қатесі', 'error');
          } finally {
            btn.disabled = false; btn.textContent = 'Кіру';
          }
        });
      }

      const registerForm = document.getElementById('register-form');
      if (registerForm) {
        registerForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = registerForm.querySelector('button[type=submit]');
          btn.disabled = true; btn.textContent = 'Жасалуда…';
          try {
            await API.register({
              firstName: document.getElementById('firstName').value.trim(),
              lastName: document.getElementById('lastName').value.trim(),
              email: document.getElementById('email').value.trim(),
              phone: document.getElementById('phone').value.trim(),
              password: document.getElementById('password').value
            });
            toast('Тіркелу сәтті! Кіріңіз.', 'success');
            navigate('login');
          } catch (err) {
            console.error(err);
            const map = {
              'auth/email-already-in-use': 'Email бос емес',
              'auth/weak-password': 'Құпиясөз тым қарапайым',
              'auth/invalid-email': 'Қате email'
            };
            toast(map[err.code] || err.message || 'Тіркелу қатесі', 'error');
          } finally {
            btn.disabled = false; btn.textContent = 'Тіркелу';
          }
        });
      }

      const resetForm = document.getElementById('reset-form');
      if (resetForm) {
        resetForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            await API.resetPassword(
              document.getElementById('email').value.trim(),
              document.getElementById('newPassword').value
            );
            toast('Құпиясөз өзгертілді!', 'success');
            navigate('login');
          } catch (err) {
            toast(err.message || 'Қате', 'error');
          }
        });
      }

      if (hash === 'client/schedule') {
        loadClientClasses();
        ['f-hall', 'f-trainer', 'f-type'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.addEventListener('change', loadClientClasses);
        });
        if (FIREBASE_READY && db) {
          const unsub = onValue(ref(db, 'classes'), () => loadClientClasses());
          window._rt_unsub = unsub;
        }
      } else if (window._rt_unsub) {
        window._rt_unsub();
        window._rt_unsub = null;
      }

      const weightForm = document.getElementById('weight-form');
      if (weightForm) {
        weightForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const v = parseFloat(document.getElementById('weight-value').value);
          if (isNaN(v)) return;
          try {
            await API.addWeightEntry(state.user.uid, {
              date: new Date().toISOString().slice(0, 10), value: v
            });
            toast('Салмақ қосылды', 'success');
            await router();
          } catch (err) { toast(err.message, 'error'); }
        });
      }

      const classForm = document.getElementById('class-form');
      if (classForm) {
        classForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const btn = classForm.querySelector('button[type=submit]');
          btn.disabled = true; btn.textContent = 'Жасалуда…';
          try {
            const dt = document.getElementById('c-datetime').value;
            const payload = {
              title: document.getElementById('c-title').value.trim(),
              type: 'group',
              trainerId: document.getElementById('c-trainer').value,
              hallId: document.getElementById('c-hall').value,
              datetime: dt ? new Date(dt).toISOString() : new Date().toISOString(),
              durationMin: parseInt(document.getElementById('c-duration').value, 10) || 60,
              capacity: parseInt(document.getElementById('c-capacity').value, 10) || 20,
              booked: 0,
              totalBookings: 0,
              price: parseInt(document.getElementById('c-price').value, 10) || 0,
              level: document.getElementById('c-level').value,
              online: document.getElementById('c-online').value === 'true',
              streamUrl: null,
              rating: { sum: 0, count: 0, avg: 0 }
            };
            await API.createClass(payload);
            toast('✅ Сабақ жасалды', 'success');
            await router();
          } catch (err) {
            console.error(err);
            toast(err.message, 'error');
          } finally {
            btn.disabled = false; btn.textContent = 'Сабақ жасау';
          }
        });
      }

      const search = document.getElementById('clients-search');
      if (search) {
        search.addEventListener('input', (e) => {
          const q = e.target.value.toLowerCase();
          document.querySelectorAll('#clients-list .card').forEach(card => {
            card.style.display = card.textContent.toLowerCase().includes(q) ? '' : 'none';
          });
        });
      }
    }

    /* ---------- CLIENT SCHEDULE HELPER ---------- */
    async function loadClientClasses() {
      try {
        const [classes, trainers, halls] = await Promise.all([
          API.getClasses(), API.getTrainers(), API.getHalls()
        ]);
        const hallF = document.getElementById('f-hall')?.value || '';
        const trainerF = document.getElementById('f-trainer')?.value || '';
        const typeF = document.getElementById('f-type')?.value || '';

        const list = Object.values(classes || {}).filter(c => {
          if (hallF && c.hallId !== hallF) return false;
          if (trainerF && c.trainerId !== trainerF) return false;
          if (typeF === 'online' && !c.online) return false;
          if (typeF === 'group' && c.type !== 'group') return false;
          return true;
        }).sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

        const el = document.getElementById('classes-list');
        if (!el) return;

        el.innerHTML = list.length ? list.map(c => {
          const free = c.capacity - c.booked;
          return `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3>${esc(c.title)}</h3>
              <p style="color:var(--muted);font-size:.85rem;margin-top:.35rem;">
                ${fmtDate(c.datetime)} · ${c.durationMin} мин
              </p>
              <p style="color:var(--muted);font-size:.85rem;">
                👤 ${esc(trainers[c.trainerId]?.name || '—')} · 🏠 ${esc(halls[c.hallId]?.name || '—')}
              </p>
            </div>
            <span class="badge ${free > 0 ? 'badge-success' : 'badge-danger'}">
              ${free > 0 ? free + ' орын' : 'орын жоқ'}
            </span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:1rem;flex-wrap:wrap;gap:.5rem;">
            <span style="font-weight:700;color:var(--accent);">${c.price} ₸</span>
            <div style="display:flex;gap:.5rem;align-items:center;">
              ${c.online ? '<span class="badge badge-info">🎥 онлайн</span>' : ''}
              <button class="btn btn-primary btn-sm" data-action="book" data-id="${esc(c.id)}" ${free <= 0 ? 'disabled' : ''}>
                Жазылу
              </button>
            </div>
          </div>
        </div>`;
        }).join('') : '<p style="color:var(--muted);">Ештеңе табылмады</p>';
      } catch (err) {
        console.error(err);
      }
    }

    /* =========================================================
       13. ACTIONS
       ========================================================= */
    async function logout() {
      await API.logout();
      state.user = null;
      localStorage.removeItem('fitcore_user');
      toast('Шықтыңыз', 'success');
      navigate('home');
      await router();
    }

    async function handleBook(classId) {
      try {
        await API.bookClass(state.user.uid, classId);
        toast('✅ Сіз жазылдыңыз!', 'success');
        await loadClientClasses();
      } catch (e) {
        toast('Қате: ' + e.message, 'error');
      }
    }

    async function handleCancel(classId) {
      if (!confirm('Жазылымды болдырмау?')) return;
      try {
        await API.cancelBooking(state.user.uid, classId);
        toast('Жазылым болдырылмады', 'success');
        await router();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function handleSubscribe(onlineId) {
      try {
        await API.subscribeOnline(state.user.uid, onlineId);
        toast('✅ Жазылым рәсімделді', 'success');
        await router();
      } catch (e) { toast(e.message, 'error'); }
    }

    async function deleteClass(id) {
      if (!confirm('Сабақты жою?')) return;
      try {
        await API.deleteClass(id);
        toast('Жойылды', 'success');
        await router();
      } catch (e) { toast(e.message, 'error'); }
    }

    function exportAnalytics() {
      const data = window._analytics || {};
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fitcore-analytics-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast('Файл жүктелді', 'success');
    }

    /* =========================================================
       14. GLOBAL DELEGATION
       ========================================================= */
    document.addEventListener('click', (e) => {
      const nav = e.target.closest('[data-nav]');
      if (nav) { e.preventDefault(); return navigate(nav.getAttribute('data-nav')); }

      const act = e.target.closest('[data-action]');
      if (act) {
        e.preventDefault();
        const action = act.getAttribute('data-action');
        const id = act.getAttribute('data-id');
        switch (action) {
          case 'logout': return logout();
          case 'book': return handleBook(id);
          case 'cancel': return handleCancel(id);
          case 'subscribe': return handleSubscribe(id);
          case 'delete-class': return deleteClass(id);
          case 'export': return exportAnalytics();
        }
      }
    });

    window.navigate = navigate;

    /* =========================================================
       15. AUTH STATE — точка входа
       ========================================================= */
    function loadSession() {
      try {
        const raw = localStorage.getItem('fitcore_user');
        if (raw) state.user = JSON.parse(raw);
      } catch (_) { state.user = null; }
    }

    loadSession();
    router();

  </script>
</body>

</html>
